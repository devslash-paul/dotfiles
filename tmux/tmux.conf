# Enable mouse scrolling, selection, and pane resizing
set -g mouse on

# Use vi bindings in scrollback/copy mode
setw -g mode-keys vi

# Claude Code popup: Ctrl+b Ctrl+c to toggle
# From outside: opens the popup
# From inside the popup: detaches (closes) it
bind C-c if-shell -F '#{==:#{session_name},popup}' 'detach' 'display-popup -E -w 80% -h 80% "tmux new-session -A -s popup \"claude\""'

# Pass terminal focus events through to apps (Claude Code, nvim)
set -g focus-events on

# Name windows after what's running. Claude Code sets its process title to
# its version (e.g. "2.1.293"), so show "claude" for those panes instead.
# Rename manually with prefix , when you want something specific.
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m/r:^[0-9.]+$,#{pane_current_command}},claude,#{pane_current_command}}'
set -g allow-rename off

# Number windows from 1 and close gaps when one is closed
set -g base-index 1
set -g renumber-windows on
