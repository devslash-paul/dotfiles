# Enable mouse scrolling, selection, and pane resizing
set -g mouse on

# Use vi bindings in scrollback/copy mode
setw -g mode-keys vi

# Claude Code popup: Ctrl+b Ctrl+c to toggle
# From outside: opens the popup
# From inside the popup: detaches (closes) it
bind C-c if-shell -F '#{==:#{session_name},popup}' 'detach' 'display-popup -E -w 80% -h 80% "tmux new-session -A -s popup \"claude\""'
